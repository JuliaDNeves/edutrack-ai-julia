<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EduTrack AI - Recuperação de senha">
    <title>EduTrack AI - Recuperar Senha</title>
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="../../css/styles.css">

    <!-- Early Theme Restore Script -->
    <script>
        (function() {
            var t = localStorage.getItem('edutrack_theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="auth-card-header">
                <a href="../../index.html" class="brand" style="text-decoration:none;">
                    <div class="brand-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span class="brand-title">EduTrack</span>
                </a>
                <h2>Recuperar senha</h2>
                <p>Informe seu e-mail para receber as instruções</p>
            </div>

            <div class="auth-info-box">
                <i class="fa-solid fa-circle-info info-icon"></i>
                <span>Enviaremos um link de redefinição de senha seguro para o seu e-mail cadastrado.</span>
            </div>

            <form class="auth-form" id="form-recovery" action="login.html" method="GET">
                <div class="auth-input-group">
                    <label for="recovery-email">E-mail cadastrado</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="recovery-email" name="email" placeholder="seu.email@exemplo.com" required>
                    </div>
                </div>

                <div class="auth-alert-success" id="recovery-feedback" style="display: none;">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Instruções de recuperação enviadas com sucesso! (Demonstração visual)</span>
                </div>

                <button type="submit" class="auth-btn-primary full-width" id="btn-submit-recovery">
                    <i class="fa-solid fa-paper-plane"></i> Solicitar recuperação
                </button>
            </form>

            <div class="auth-card-footer">
                <p>Lembrou a senha? <a href="login.html">Voltar ao login</a></p>
                <a href="../../index.html" class="auth-btn-secondary full-width btn-back-home">
                    <i class="fa-solid fa-house"></i> Voltar à página inicial
                </a>
            </div>

        </div>
    </div>

    <!-- JavaScript Interactions -->
    <script src="../../js/auth.js"></script>
    <script src="../../js/app.js"></script>
</body>
</html>
