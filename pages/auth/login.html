<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EduTrack AI - Acesse sua conta">
    <title>EduTrack AI - Login</title>
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="auth-card-header">
                <a href="../../index.html" class="brand" style="text-decoration:none;">
                    <div class="brand-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span class="brand-title">EduTrack</span>
                </a>
                <h2>Acessar o EduTrack</h2>
                <p>Entre com suas credenciais para continuar</p>
            </div>

            <form class="auth-form" id="form-login">
                <div class="auth-input-group">
                    <label for="login-email">E-mail</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="login-email" name="email" placeholder="seu.email@exemplo.com" required>
                    </div>
                </div>

                <div class="auth-input-group">
                    <label for="login-password">Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                    </div>
                    <div style="text-align: right;">
                        <a href="forgot-password.html" class="auth-link-sm">Esqueci minha senha</a>
                    </div>
                    
                </div>

                <div class="auth-alert-error" id="login-feedback" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="login-feedback-text"></span>
                </div>

                <button type="submit" class="auth-btn-primary full-width" id="btn-submit-login">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar
                </button>
            </form>

            <div class="auth-card-footer">
                <p>Não tem uma conta? <a href="register.html">Criar conta</a></p>
                <a href="../../index.html" class="auth-btn-secondary full-width btn-back-home">
                    <i class="fa-solid fa-house"></i> Voltar à página inicial
                </a>
            </div>

        </div>
    </div>

    <!-- JavaScript Interactions -->
    <script src="../../js/auth.js"></script>
    <script src="../../js/app.js"></script>
</body>
</html>
