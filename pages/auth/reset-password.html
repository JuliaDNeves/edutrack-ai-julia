<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EduTrack AI - Redefinição de senha">
    <title>EduTrack AI - Redefinir Senha</title>
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="auth-card-header">
                <a href="../../index.html" class="brand" style="text-decoration:none;">
                    <div class="brand-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span class="brand-title">EduTrack</span>
                </a>
                <h2>Redefinir senha</h2>
                <p>Digite sua nova senha para atualizar seu acesso</p>
            </div>

            <form class="auth-form" id="form-reset-password">
                <div class="auth-input-group">
                    <label for="reset-password">Nova senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="reset-password" name="new_password" placeholder="Digite a nova senha" required>
                    </div>
                </div>

                <div class="auth-input-group">
                    <label for="reset-confirm-password">Confirmar senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock-keyhole input-icon"></i>
                        <input type="password" id="reset-confirm-password" name="confirm_password" placeholder="Repita a nova senha" required>
                    </div>
                </div>

                <div class="auth-alert-error" id="reset-feedback" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="reset-feedback-text"></span>
                </div>

                <button type="submit" class="auth-btn-primary full-width" id="btn-submit-reset">
                    <i class="fa-solid fa-key"></i> Redefinir senha
                </button>
            </form>

            <div class="auth-card-footer">
                <p>Lembrou a senha? <a href="login.html">Voltar ao login</a></p>
                <a href="../../index.html" class="auth-btn-secondary full-width btn-back-home">
                    <i class="fa-solid fa-house"></i> Voltar à página inicial
                </a>
            </div>

        </div>
    </div>

    <!-- JavaScript Interactions -->
    <script src="../../js/auth.js"></script>
    <script src="../../js/app.js"></script>
</body>
</html>
