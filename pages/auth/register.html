<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EduTrack AI - Criar uma nova conta">
    <title>EduTrack AI - Cadastro</title>
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="auth-card-header">
                <a href="../../index.html" class="brand" style="text-decoration:none;">
                    <div class="brand-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span class="brand-title">EduTrack</span>
                </a>
                <h2>Criar sua conta</h2>
                <p>Junte-se ao EduTrack para organizar sua rotina acadêmica</p>
            </div>

            <form class="auth-form" id="form-register">
                <div class="auth-input-group">
                    <label for="register-email">E-mail</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="register-email" name="email" placeholder="seu.email@exemplo.com" required>
                    </div>
                </div>

                <div class="auth-input-group">
                    <label for="register-password">Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="register-password" name="password" placeholder="Crie uma senha forte" required>
                    </div>
                </div>

                <div class="auth-input-group">
                    <label for="register-confirm-password">Confirmar Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock-keyhole input-icon"></i>
                        <input type="password" id="register-confirm-password" name="confirm_password" placeholder="Repita sua senha" required>
                    </div>
                </div>

                <div class="auth-alert-error" id="register-feedback" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="register-feedback-text"></span>
                </div>

                <button type="submit" class="auth-btn-primary full-width" id="btn-submit-register">
                    <i class="fa-solid fa-user-plus"></i> Criar conta
                </button>
            </form>

            <div class="auth-card-footer">
                <p>Já possui uma conta? <a href="login.html">Fazer login</a></p>
                <a href="../../index.html" class="auth-btn-secondary full-width btn-back-home">
                    <i class="fa-solid fa-house"></i> Voltar à página inicial
                </a>
            </div>

        </div>
    </div>

    <!-- JavaScript Interactions -->
    <script src="../../js/auth.js"></script>
    <script src="../../js/app.js"></script>
</body>
</html>
